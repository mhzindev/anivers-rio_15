<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aniversário de 15 anos · Marcella Karoline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--esmeralda:#0B5D3B; --musgo:#2F6B4F; --dourado:#C9A96E; --marfim:#FBF7EE; --g:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--marfim)}
.hero{position:relative; width:390px; height:844px; margin:0 auto; overflow:hidden; background:var(--marfim); color:var(--esmeralda);
  font-family:'Inter',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 var(--g)}
.eyebrow{font-weight:400; font-size:15px; line-height:1.5; letter-spacing:-.005em; color:var(--musgo); max-width:240px}
.kicker{margin-top:44px; font-weight:700; font-size:15px; letter-spacing:.34em; text-transform:uppercase; padding-left:.34em}
.fifteen{position:relative; margin-top:4px; font-weight:800; font-size:236px; line-height:.86; letter-spacing:-.075em; padding-right:.075em; cursor:default;
  background:linear-gradient(105deg,var(--esmeralda) 0%,var(--esmeralda) 40%,#2d8a5f 48%,var(--dourado) 52%,#2d8a5f 54%,var(--esmeralda) 58%,var(--esmeralda) 100%);
  background-size:260% 100%; background-position:100% 0;
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  transition:background-position 1.1s cubic-bezier(.2,.7,.2,1)}
.fifteen:hover{background-position:0% 0}
.anos{margin-top:2px; font-weight:800; font-size:54px; line-height:1; letter-spacing:-.045em}
.rule{width:44px; height:1px; background:var(--dourado); margin:38px 0 22px}
.sub{font-weight:300; font-size:19px; line-height:1.4; letter-spacing:-.01em; max-width:270px; color:var(--esmeralda)}
.cue{position:absolute; bottom:0; left:50%; width:1px; height:48px; background:linear-gradient(180deg,rgba(201,169,110,0),var(--dourado))}
</style>
</head>
<body>
<section class="hero">
  <p class="eyebrow">Você está convidado a fazer parte do meu</p>
  <h1 style="display:contents">
    <span class="kicker">Aniversário de</span>
    <span class="fifteen">15</span>
    <span class="anos">anos</span>
  </h1>
  <i class="rule"></i>
  <p class="sub">Sua presença vai tornar esta noite inesquecível</p>
  <i class="cue"></i>
</section>
</body>
</html>
